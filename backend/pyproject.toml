[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG backend for the Physical AI textbook"
requires-python = "==3.12.*"
dependencies = [
  "fastapi[standard]",
  "openai-agents",
  "openai-chatkit<=1.4.0",
  "qdrant-client",
  "openai",
  "cohere",
  "python-dotenv",
  "pyjwt[crypto]>=2.8.0",
  "httpx>=0.27.0",
  "cryptography>=42.0.0",
]

[tool.uv]
dev-dependencies = []

[tool.pytest.ini_options]
addopts = "-q"
[tool.vercel]
entrypoint = "main:app"
